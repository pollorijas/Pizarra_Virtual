name: Compilar PizarraVirtual.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publicar como release con esta versión (p. ej. v1.2.0). Vacío = solo compilar."
        required: false
        default: ""
      borrar_anteriores:
        description: "Al publicar, eliminar las releases (y etiquetas) anteriores y dejar solo esta."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas (pantalla virtual)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Pruebas con ventanas reales de Windows (100 %)
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest -q -rs

      - name: Pruebas con ventanas reales de Windows (escalado 150 %)
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: "1.5"
        run: python -m pytest -q -rs

      - name: Subir capturas de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-pruebas
          path: test-screens/
          if-no-files-found: ignore

      - name: Compilar el ejecutable
        run: pyinstaller --noconfirm --clean PizarraVirtual.spec

      - name: Autodiagnóstico del .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PizarraVirtual.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\PizarraVirtual\pizarra.log"
          if ($p.ExitCode -ne 0) { throw "El autodiagnóstico falló (código $($p.ExitCode))" }

      - name: Generar el manual de usuario (PDF)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/build_manual.py --out "dist/Manual de usuario.pdf"

      - name: Empaquetar en .zip (ejecutable + manual)
        shell: pwsh
        run: |
          $ver = "${{ inputs.version || github.ref_name }}"
          if (-not $ver.StartsWith("v")) { $ver = "dev" }
          $zip = "dist/PizarraVirtual-$ver.zip"
          Compress-Archive -Path "dist/PizarraVirtual.exe", "dist/Manual de usuario.pdf" -DestinationPath $zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries | ForEach-Object { $_.FullName }
          Write-Host "Contenido de $zip :"; $names | ForEach-Object { Write-Host "  $_" }
          if (-not ($names -contains "PizarraVirtual.exe" -and $names -contains "Manual de usuario.pdf")) { throw "El zip no está completo" }
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PizarraVirtual
          path: ${{ env.ZIP }}

      - name: Publicar release (etiqueta v* o versión indicada al lanzarlo a mano)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          # Si la etiqueta no existe, se crea sobre el commit compilado.
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Pizarra Virtual ${{ inputs.version || github.ref_name }}
          body_path: notas/${{ inputs.version || github.ref_name }}.md
          files: ${{ env.ZIP }}
          generate_release_notes: true

      - name: Eliminar releases anteriores (si se pidió)
        if: github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.borrar_anteriores
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $current = "${{ inputs.version }}"
          $tags = gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName'
          foreach ($t in $tags) {
            if ($t -and $t -ne $current) {
              Write-Host "Eliminando release $t"
              gh release delete $t --repo "${{ github.repository }}" --yes --cleanup-tag
            }
          }
          gh release list --repo "${{ github.repository }}"
