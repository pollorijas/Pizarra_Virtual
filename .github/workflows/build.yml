name: Compilar PizarraVirtual.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Compilar el ejecutable
        run: pyinstaller --noconfirm --clean PizarraVirtual.spec

      - name: Autodiagnóstico del .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PizarraVirtual.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\PizarraVirtual\pizarra.log"
          if ($p.ExitCode -ne 0) { throw "El autodiagnóstico falló (código $($p.ExitCode))" }

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PizarraVirtual-exe
          path: dist/PizarraVirtual.exe

      - name: Publicar release (solo en etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PizarraVirtual.exe
          generate_release_notes: true
