name: Compilar PizarraVirtual.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publicar como release con esta versión (p. ej. v1.1.0). Vacío = solo compilar."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas (pantalla virtual)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Pruebas con ventanas reales de Windows (100 %)
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest -q -rs

      - name: Pruebas con ventanas reales de Windows (escalado 150 %)
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: "1.5"
        run: python -m pytest -q -rs

      - name: Subir capturas de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-pruebas
          path: test-screens/
          if-no-files-found: ignore

      - name: Compilar el ejecutable
        run: pyinstaller --noconfirm --clean PizarraVirtual.spec

      - name: Autodiagnóstico del .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PizarraVirtual.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\PizarraVirtual\pizarra.log"
          if ($p.ExitCode -ne 0) { throw "El autodiagnóstico falló (código $($p.ExitCode))" }

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PizarraVirtual-exe
          path: dist/PizarraVirtual.exe

      - name: Publicar release (etiqueta v* o versión indicada al lanzarlo a mano)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          # Si la etiqueta no existe, se crea sobre el commit compilado.
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Pizarra Virtual ${{ inputs.version || github.ref_name }}
          body_path: notas/${{ inputs.version || github.ref_name }}.md
          files: dist/PizarraVirtual.exe
          generate_release_notes: true
